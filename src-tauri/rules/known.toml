category = "developer"
patterns = [
  "Xcode/iOS DeviceSupport",
  "Xcode/watchOS DeviceSupport",
  "Xcode/tvOS DeviceSupport",
]
risk = "baixo"
reason = "Símbolos de depuração de versões antigas do iOS/watchOS; recriados ao reconectar o aparelho."
