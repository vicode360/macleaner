category = "developer"
patterns = ["Caches/JetBrains"]
risk = "baixo"
reason = "Índices e caches de IDEs JetBrains; reconstruídos automaticamente ao abrir projetos."
selected_by_default = true

[[rule]]
id = "docker-desktop"
name = "Docker Desktop Data"
category = "developer"
patterns = ["Containers/com.docker.docker"]
risk = "alto"
reason = "Disco virtual (Docker.raw) com imagens, containers e volumes; prefira limpar via docker system prune."
