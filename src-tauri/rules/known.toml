[[rule]]
id = "puppeteer-cache"
name = "Puppeteer Cache"
category = "developer"
patterns = ["Caches/puppeteer", ".cache/puppeteer"]
risk = "baixo"
reason = "Binários em cache do Chromium baixados pelo Puppeteer."
